name: Refresh Bomberman

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-bomberman
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate Bomberman in GitHub light and dark themes
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # 5.3.2
        with:
          github_user_name: Abhi-eversor
          github_token: ${{ github.token }}
          games: bomberman
          hide_month_labels: 'false'

      - name: Check both generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('bomberman-contribution-graph.svg', 'bomberman-contribution-graph-dark.svg'):
              root = ET.parse(Path('dist') / name).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', name
              assert root.findall('.//{http://www.w3.org/2000/svg}animate'), name
              assert float(root.attrib['width']) > 0 and float(root.attrib['height']) > 0, name
          PY

      - name: Update only the Bomberman assets
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$DEFAULT_BRANCH"
          mkdir -p assets
          cp dist/bomberman-contribution-graph.svg assets/
          cp dist/bomberman-contribution-graph-dark.svg assets/
          git add -- assets/bomberman-contribution-graph.svg assets/bomberman-contribution-graph-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Bomberman contribution calendar' -- assets/bomberman-contribution-graph.svg assets/bomberman-contribution-graph-dark.svg
          git push origin "HEAD:$DEFAULT_BRANCH"
