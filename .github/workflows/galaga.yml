name: Refresh Galaga

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/galaga.yml
  schedule:
    - cron: '17 3,9,15,21 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-galaga
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate Galaga from the GitHub contribution calendar
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # 5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          games: galaga
          hide_month_labels: 'false'

      - name: Check both generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {'galaga-contribution-graph.svg', 'galaga-contribution-graph-dark.svg'}
          assert {p.name for p in Path('dist').iterdir()} == expected
          for name in expected:
              root = ET.parse(Path('dist') / name).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', name
              assert root.findall('.//{http://www.w3.org/2000/svg}animate'), name
              assert float(root.attrib['width']) > 0 and float(root.attrib['height']) > 0, name
          PY

      - name: Publish generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
